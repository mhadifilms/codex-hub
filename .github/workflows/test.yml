name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tmux
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install tmux
          else
            sudo apt-get update && sudo apt-get install -y tmux
          fi
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  windows-wsl:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Ubuntu in WSL
        shell: pwsh
        run: |
          wsl --set-default-version 1
          if ($LASTEXITCODE -ne 0) { throw 'WSL setup failed' }
          wsl --install --distribution Ubuntu --web-download --no-launch
          if ($LASTEXITCODE -ne 0) { throw 'Ubuntu installation failed' }
      - name: Test the Windows / WSL installation and TUI
        shell: pwsh
        run: |
          $LinuxRepo = wsl --distribution Ubuntu --user root --exec wslpath -u ($env:GITHUB_WORKSPACE.Replace('\', '/'))
          if ($LASTEXITCODE -ne 0) { throw 'WSL path conversion failed' }
          $LinuxRepo = $LinuxRepo.Trim()
          wsl --distribution Ubuntu --user root --exec bash "$LinuxRepo/.github/scripts/test-windows.sh" "$LinuxRepo"
          if ($LASTEXITCODE -ne 0) { throw 'Windows / WSL tests failed' }
