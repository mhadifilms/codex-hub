set -g mouse on
# Let the application receive right-clicks instead of opening tmux's pane menu.
bind-key -T root MouseDown3Pane select-pane -t = \; send-keys -M
unbind-key -T root MouseUp3Pane
set -g default-terminal 'tmux-256color'
set -g renumber-windows on
set -g status-position top
set -g status-style 'bg=colour234,fg=colour245'
set -g status-left-length 20
set -g status-left '  Codex Hub  '
set -g status-right-length 60
set -g status-right '#{@hub_label}  ·  #W  '
set -g window-status-format ''
set -g window-status-current-format ''
set -g pane-border-style 'fg=colour235'
set -g pane-active-border-style 'fg=colour235'
set -g automatic-rename off
# Keyboard fallbacks remain available; the interface uses visible mouse controls.
bind-key g select-pane -t '#{@hub_sidebar}'
# Prevent old popup/new-window overrides from surviving an upgrade.
unbind-key c
bind-key c new-window
unbind-key r
bind-key C new-window -c '#{pane_current_path}' -n shell
set -g window-style 'bg=colour233,fg=colour253'
set -g window-active-style 'bg=colour233,fg=colour253'
set -g popup-style 'bg=colour234,fg=colour253'
set -g popup-border-style 'fg=colour238'

# Native mouse text selection and terminal clipboard support.
set -g set-clipboard on
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
